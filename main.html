<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div id="wrapper">
    <!-- Decoraciones flotantes -->
    <div class="floating-hearts">
        <img src="./assets/img/icons/corazones_1.png" class="heart heart-1" alt="">
        <img src="./assets/img/icons/corazones_1.png" class="heart heart-2" alt="">
        <img src="./assets/img/icons/corazones_1.png" class="heart heart-3" alt="">
        <img src="./assets/img/icons/corazones_1.png" class="heart heart-4" alt="">
    </div>

    <!-- Iconos decorativos con rotaciones -->
    <img src="./assets/img/icons/michi_rojo.png" class="heart michi" alt="">
    <img src="./assets/img/icons/perrito_rojo.png" class="decoracion perrito" alt="">

    <div class="content">
        <div class="main-layout">
            <!-- Lado izquierdo: Título principal -->
            <div class="left-side">
                <div class="title-box">
                    <h1 class="happy">
                        <span style="--delay: 0.3s;">!</span>
                        <span style="--delay: 0.5s;">H</span>
                        <span style="--delay: 0.7s;">A</span>
                        <span style="--delay: 0.9s;">P</span>
                        <span style="--delay: 1.1s;">P</span>
                        <span style="--delay: 1.3s;">Y</span>
                    </h1>
                    <h2 class="valentine">
                        <span style="--delay: 1.6s;">V</span>
                        <span style="--delay: 1.8s;">A</span>
                        <span style="--delay: 2.0s;">L</span>
                        <span style="--delay: 2.2s;">E</span>
                        <span style="--delay: 2.4s;">N</span>
                        <span style="--delay: 2.6s;">T</span>
                        <span style="--delay: 2.8s;">I</span>
                        <span style="--delay: 3.0s;">N</span>
                        <span style="--delay: 3.2s;">E</span>
                        <span style="--delay: 3.4s;">!</span>
                    </h2>
                </div>
            </div>

            <!-- Lado derecho: Texto romántico -->
            <div class="right-side">
                <p class="romantic-text">
                    Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown
                </p>
            </div>
        </div>

        <!-- Hello Kitty principal -->

    </div>

    <!-- Botón siguiente -->
    <a href="reproductor.html" class="btn-siguiente">
        <span>SIGUIENTE</span>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M7 4L13 10L7 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
</div>

</body>
</html>
