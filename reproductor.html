<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Niña Hermosa ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-intenso: #ff4d6d;
            --rosa-claro: #ffb3c1;
            --blanco: #ffffff;
            --glass: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            color: white;
        }

        /* --- FONDO GIF --- */
        #bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: background-image 0.8s ease;
        }

        .overlay-dark {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
            z-index: -1;
        }

        /* --- MODAL TIERNO --- */
        #modal-felicitaciones {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--blanco);
            padding: 50px;
            border-radius: 40px;
            text-align: center;
            max-width: 500px;
            position: relative;
            border: 8px solid var(--rosa-claro);
            animation: bounceIn 0.8s ease;
        }

        .modal-icon {
            width: 120px;
            margin-top: -100px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
            animation: float 3s ease-in-out infinite;
        }

        .modal-content h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: var(--rosa-intenso);
            margin: 20px 0;
        }

        /* --- LAYOUT --- */
        .main-ui {
            display: flex;
            width: 100%;
            height: 100%;
            padding: 40px;
            z-index: 10;
        }

        /* Letras en el centro */
        .lyrics-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-bottom: 150px; /* Espacio para controles abajo */
        }

        #lyrics-display {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            line-height: 1.4;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.8);
            min-height: 150px;
            transition: all 0.5s ease;
        }

        /* Playlist a la derecha */
        .playlist-side {
            width: 350px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: -10px 0 30px rgba(0,0,0,0.3);
        }

        .playlist-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        .playlist-item.active {
            background: var(--rosa-intenso);
            transform: scale(1.05);
        }

        /* Controles abajo al centro */
        .bottom-controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        #song-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; }
        #song-artist { opacity: 0.7; margin-bottom: 15px; }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .btn-play {
            width: 80px; height: 80px; border-radius: 50%;
            background: var(--rosa-intenso); color: white;
            border: none; cursor: pointer; font-size: 1.5rem;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
        }

        /* --- ANIMACIONES --- */
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Scrollbar */
        .playlist-side::-webkit-scrollbar { width: 4px; }
        .playlist-side::-webkit-scrollbar-thumb { background: var(--rosa-claro); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="bg-overlay"></div>
    <div class="overlay-dark"></div>

    <div id="modal-felicitaciones">
        <div class="modal-content">
            <img src="./assets/img/icons/nosotros.png" class="modal-icon" alt="">
            <h2>Tu regalo del 14❤️</h2>
            <p style="color: #666; margin-bottom: 30px;">Aunque no es la forma, espero que este detalle pueda alegrarte tanto como vos me alegras a mi ❤️</p>
            <button class="btn-play" style="width: auto; padding: 0 40px; border-radius: 50px;" onclick="iniciarReproductor()">Entrar ❤️</button>
        </div>
    </div>

    <div class="main-ui">
        <div class="lyrics-zone">
            <div id="lyrics-display">...</div>
        </div>

        <div class="playlist-side" id="playlist-container">
            <h3 style="margin-bottom: 20px; font-family: 'Playfair Display';">Nuestras Canciones❤️</h3>
            </div>
    </div>

    <div class="bottom-controls">
        <h2 id="song-title">Cargando...</h2>
        <p id="song-artist">Artista</p>
        <div class="btn-group">
            <button onclick="prevSong()" style="background:none; border:none; color:white; font-size:2rem; cursor:pointer;">⏮</button>
            <button class="btn-play" id="play-btn" onclick="togglePlay()">▶</button>
            <button onclick="nextSong()" style="background:none; border:none; color:white; font-size:2rem; cursor:pointer;">⏭</button>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const songs = [
            { number: 1, title: "Someone To Spend Time With", artist: "Los Retros", background: "./songs/s1/s1.gif", audio: "./songs/s1/Los Retros - Someone To Spend Time With.mp3", lyrics: "./songs/s1/song1.lrc" },
            { number: 2, title: "Lover Is a Day", artist: "CUCO", background: "./songs/s2/s2.gif", audio: "./songs/s2/CUCO - Lover Is a Day (Audio).mp3", lyrics: "./songs/s2/song2.lrc" },
            { number: 3, title: "Piel Canela", artist: "Cuco", background: "./songs/s3/s3.gif", audio: "./songs/s3/Cuco - Piel Canela (Audio).mp3", lyrics: "./songs/s3/song3.lrc" },
            { number: 4, title: "Decir Adios", artist: "Cuco (ft. DannyLux)", background: "./songs/s4/s4.gif", audio: "./songs/s4/Cuco - Decir Adios (with DannyLux) [Official Visualizer].mp3", lyrics: "./songs/s4/song4.lrc" },
            { number: 5, title: "Bossa No Sé", artist: "Cuco (ft. Jean Carter)", background: "./songs/s5/s5.gif", audio: "./songs/s5/Cuco - Bossa No Sé (Lyric Video) ft. Jean Carter.mp3", lyrics: "./songs/s5/song5.lrc" },
            { number: 6, title: "Doma", artist: "Josean Log", background: "./songs/s6/s6.gif", audio: "./songs/s6/Josean Log - Doma (Lyric Video).mp3", lyrics: "./songs/s6/song6.lrc" },
            { number: 7, title: "this is what falling in love feels like", artist: "JVKE", background: "./songs/s7/s7.gif", audio: "./songs/s7/JVKE - this is what falling in love feels like (Lyrics).mp3", lyrics: "./songs/s7/song7.lrc" },
            { number: 8, title: "Chachachá", artist: "Josean Log", background: "./songs/s8/s8.gif", audio: "./songs/s8/Josean Log - Chachachá (Lyric Video).mp3", lyrics: "./songs/s8/song8.lrc" },
            { number: 9, title: "Alguien Como Tú", artist: "Jósean Log", background: "./songs/s9/s9.gif", audio: "./songs/s9/Jósean Log - Alguien Como Tú.mp3", lyrics: "./songs/s9/song9.lrc" },
            { number: 10, title: "This Side of Paradise", artist: "Coyote Theory", background: "./songs/s10/s10.gif", audio: "./songs/s10/Coyote Theory - This Side of Paradise (Lyric Video).mp3", lyrics: "./songs/s10/song10.lrc" },
            { number: 11, title: "Here With Me", artist: "d4vd", background: "./songs/s11/s11.gif", audio: "./songs/s11/d4vd - Here With Me [Official Music Video].mp3", lyrics: "./songs/s11/song11.lrc" }
        ];

        let currentIndex = 0;
        let lrcLines = [];
        const audio = document.getElementById('audio-player');
        const lyricsDisplay = document.getElementById('lyrics-display');

        function cargarPlaylist() {
            const container = document.getElementById('playlist-container');
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.innerHTML = `<strong>${index + 1}.</strong> ${song.title}`;
                item.onclick = () => loadSong(index);
                container.appendChild(item);
            });
        }

        async function loadSong(index) {
            currentIndex = index;
            const song = songs[currentIndex];
            
            document.getElementById('song-title').innerText = song.title;
            document.getElementById('song-artist').innerText = song.artist;
            document.getElementById('bg-overlay').style.backgroundImage = `url(${song.background})`;
            
            audio.src = song.audio;
            
            // Cargar y procesar LRC
            try {
                const res = await fetch(song.lyrics);
                const text = await res.text();
                parseLRC(text);
            } catch (e) {
                lrcLines = [];
                lyricsDisplay.innerText = "Disfruta la música, amor ❤️";
            }

            document.querySelectorAll('.playlist-item').forEach((it, i) => it.classList.toggle('active', i === index));
            
            audio.play();
            document.getElementById('play-btn').innerText = '⏸';
        }

        function parseLRC(lrcText) {
            lrcLines = [];
            const lines = lrcText.split('\n');
            const timeReg = /\[(\d+):(\d+\.\d+)\]/;
            
            lines.forEach(line => {
                const match = timeReg.exec(line);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseFloat(match[2]);
                    const time = minutes * 60 + seconds;
                    const text = line.replace(timeReg, '').trim();
                    if (text) lrcLines.push({ time, text });
                }
            });
        }

        audio.ontimeupdate = () => {
            const time = audio.currentTime;
            const currentLine = lrcLines.filter(l => l.time <= time).pop();
            if (currentLine) {
                if (lyricsDisplay.innerText !== currentLine.text) {
                    lyricsDisplay.style.opacity = 0;
                    setTimeout(() => {
                        lyricsDisplay.innerText = currentLine.text;
                        lyricsDisplay.style.opacity = 1;
                    }, 200);
                }
            }
        };

        function togglePlay() {
            if (audio.paused) { audio.play(); document.getElementById('play-btn').innerText = '⏸'; }
            else { audio.pause(); document.getElementById('play-btn').innerText = '▶'; }
        }

        function nextSong() { currentIndex = (currentIndex + 1) % songs.length; loadSong(currentIndex); }
        function prevSong() { currentIndex = (currentIndex - 1 + songs.length) % songs.length; loadSong(currentIndex); }
        
        function iniciarReproductor() {
            document.getElementById('modal-felicitaciones').style.display = 'none';
            loadSong(0);
        }

        window.onload = cargarPlaylist;
        audio.onended = nextSong;
    </script>
</body>
</html>
