<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Niña Hermosa ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-intenso: #ff4d6d;
            --rosa-claro: #ffb3c1;
            --dorado: #d4af37;
            --blanco: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #1a1a1a;
            transition: background 1s ease;
        }

        /* --- FONDO DINÁMICO --- */
        #bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            filter: brightness(0.4) blur(4px);
            z-index: -1;
            transition: background-image 0.8s ease-in-out;
        }

        /* --- MODAL DE BIENVENIDA --- */
        #modal-felicitaciones {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--blanco);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 450px;
            border: 4px solid var(--rosa-claro);
            box-shadow: 0 0 50px rgba(255, 77, 109, 0.5);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-content h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: var(--rosa-intenso);
            margin-bottom: 15px;
        }

        .modal-content p { color: #555; margin-bottom: 25px; }

        .btn-entrar {
            background: var(--rosa-intenso);
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.3s;
            font-weight: 600;
        }

        .btn-entrar:hover { transform: scale(1.1); background: #ff758f; }

        /* --- REPRODUCTOR --- */
        .player-container {
            width: 90%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            display: flex;
            border: 1px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Lado Izquierdo: Info */
        .player-info {
            flex: 1.5;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        #song-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-bottom: 5px; }
        #song-artist { font-size: 1.1rem; opacity: 0.8; margin-bottom: 30px; }

        .controls { display: flex; align-items: center; gap: 20px; }
        .btn-control {
            background: none; border: none; color: white; cursor: pointer;
            font-size: 2rem; transition: 0.3s;
        }
        .btn-play {
            background: white; color: var(--rosa-intenso);
            width: 70px; height: 70px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem;
        }

        /* Lado Derecho: Playlist */
        .playlist {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            max-height: 450px;
            overflow-y: auto;
        }

        .playlist-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 15px;
            cursor: pointer;
            color: white;
            transition: 0.3s;
            background: rgba(255,255,255,0.05);
        }

        .playlist-item:hover { background: rgba(255,255,255,0.2); }
        .playlist-item.active { background: var(--rosa-intenso); }

        /* --- ANIMACIONES --- */
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Scrollbar aesthetic */
        .playlist::-webkit-scrollbar { width: 5px; }
        .playlist::-webkit-scrollbar-thumb { background: var(--rosa-claro); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="bg-overlay"></div>

    <div id="modal-felicitaciones">
        <div class="modal-content">
            <img src="./assets/img/icons/michi_rojo.png" style="width: 80px;" alt="">
            <h2>¡Felicidades mi Amor!</h2>
            <p>He preparado este espacio especial para ti, con nuestras canciones favoritas y momentos mágicos. Espero que te guste tanto como yo te amo.</p>
            <button class="btn-entrar" onclick="iniciarReproductor()">Abrir mi regalo ❤️</button>
        </div>
    </div>

    <div class="player-container">
        <div class="player-info">
            <div id="song-title">Cargando...</div>
            <div id="song-artist">Artista</div>
            
            <div class="controls">
                <button class="btn-control" onclick="prevSong()">⏮</button>
                <button class="btn-control btn-play" id="play-btn" onclick="togglePlay()">▶</button>
                <button class="btn-control" onclick="nextSong()">⏭</button>
            </div>
        </div>

        <div class="playlist" id="playlist-container">
            </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const songs = [
            { number: 1, title: "Someone To Spend Time With", artist: "Los Retros", background: "./songs/backgrounds/s1.gif", audio: "./songs/s1/Los Retros - Someone To Spend Time With.mp3" },
            { number: 2, title: "Lover Is a Day", artist: "CUCO", background: "./songs/backgrounds/s2.gif", audio: "./songs/s2/CUCO - Lover Is a Day (Audio).mp3" },
            { number: 3, title: "Piel Canela", artist: "Cuco", background: "./songs/backgrounds/s3.gif", audio: "./songs/s3/Cuco - Piel Canela (Audio).mp3" },
            { number: 4, title: "Decir Adios", artist: "Cuco (ft. DannyLux)", background: "./songs/backgrounds/s4.gif", audio: "./songs/s4/Cuco - Decir Adios (with DannyLux) [Official Visualizer].mp3" },
            { number: 5, title: "Bossa No Sé", artist: "Cuco (ft. Jean Carter)", background: "./songs/backgrounds/s5.gif", audio: "./songs/s5/Cuco - Bossa No Sé (Lyric Video) ft. Jean Carter.mp3" },
            { number: 6, title: "Doma", artist: "Josean Log", background: "./songs/backgrounds/s6.gif", audio: "./songs/s6/Josean Log - Doma (Lyric Video).mp3" },
            { number: 7, title: "this is what falling in love feels like", artist: "JVKE", background: "./songs/backgrounds/s7.gif", audio: "./songs/s7/JVKE - this is what falling in love feels like (Lyrics).mp3" },
            { number: 8, title: "Chachachá", artist: "Josean Log", background: "./songs/backgrounds/s8.gif", audio: "./songs/s8/Josean Log - Chachachá (Lyric Video).mp3" },
            { number: 9, title: "Alguien Como Tú", artist: "Jósean Log", background: "./songs/backgrounds/s9.gif", audio: "./songs/s9/Jósean Log - Alguien Como Tú.mp3" },
            { number: 10, title: "This Side of Paradise", artist: "Coyote Theory", background: "./songs/backgrounds/s10.gif", audio: "./songs/s10/Coyote Theory - This Side of Paradise (Lyric Video).mp3" },
            { number: 11, title: "Here With Me", artist: "d4vd", background: "./songs/backgrounds/s11.gif", audio: "./songs/s11/d4vd - Here With Me [Official Music Video].mp3" }
        ];

        let currentIndex = 0;
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const bgOverlay = document.getElementById('bg-overlay');

        function cargarPlaylist() {
            const container = document.getElementById('playlist-container');
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.innerHTML = `<strong>${index + 1}.</strong> ${song.title}`;
                item.onclick = () => loadSong(index);
                container.appendChild(item);
            });
        }

        function loadSong(index) {
            currentIndex = index;
            const song = songs[currentIndex];
            
            document.getElementById('song-title').innerText = song.title;
            document.getElementById('song-artist').innerText = song.artist;
            audio.src = song.audio;
            bgOverlay.style.backgroundImage = `url(${song.background})`;

            // Actualizar playlist visual
            document.querySelectorAll('.playlist-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });

            audio.play();
            playBtn.innerText = '⏸';
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = '⏸';
            } else {
                audio.pause();
                playBtn.innerText = '▶';
            }
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % songs.length;
            loadSong(currentIndex);
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            loadSong(currentIndex);
        }

        function iniciarReproductor() {
            document.getElementById('modal-felicitaciones').style.display = 'none';
            loadSong(0);
        }

        // Auto-play siguiente canción
        audio.onended = nextSong;

        window.onload = cargarPlaylist;
    </script>
</body>
</html>
