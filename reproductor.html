<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Niña Hermosa ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-intenso: #ff4d6d;
            --rosa-claro: #ffb3c1;
            --blanco: #ffffff;
            --glass: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: white;
        }

        /* --- FONDO GIF --- */
        #bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: background-image 0.8s ease;
        }

        .overlay-dark {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.7));
            z-index: -1;
        }

        /* --- MODAL ADAPTADO --- */
        #modal-felicitaciones {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--blanco);
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            position: relative;
            border: 6px solid var(--rosa-claro);
            animation: bounceIn 0.8s ease;
        }

        .modal-icon {
            width: 80px;
            margin-top: -70px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
            animation: float 3s ease-in-out infinite;
        }

        .modal-content h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 2.5rem;
            color: var(--rosa-intenso);
            margin: 15px 0;
        }

        /* --- LAYOUT PRINCIPAL --- */
        .main-ui {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100vh - 180px); /* Resta espacio para controles */
            padding: 20px;
            z-index: 10;
            gap: 20px;
        }

        /* Letras en el centro */
        .lyrics-zone {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #lyrics-display {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem); /* Tamaño fluido */
            line-height: 1.4;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.9);
            transition: opacity 0.4s ease;
            padding: 0 10px;
        }

        /* Playlist a la derecha (Se oculta en móviles muy pequeños o se adapta) */
        .playlist-side {
            width: 300px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .playlist-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(255,255,255,0.05);
            font-size: 0.85rem;
        }

        .playlist-item.active {
            background: var(--rosa-intenso);
            transform: scale(1.02);
        }

        /* --- CONTROLES ABAJO --- */
        .bottom-controls {
            height: 180px;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding-bottom: 20px;
        }

        #song-title { 
            font-family: 'Playfair Display', serif; 
            font-size: clamp(1.1rem, 4vw, 1.6rem); 
            margin-bottom: 5px;
        }
        #song-artist { font-size: 0.9rem; opacity: 0.7; margin-bottom: 15px; }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .btn-play {
            width: 65px; height: 65px; border-radius: 50%;
            background: var(--rosa-intenso); color: white;
            border: none; cursor: pointer; font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        .btn-nav {
            background: none; border: none; color: white; 
            font-size: 1.8rem; cursor: pointer;
        }

        /* --- MEDIA QUERIES PARA MÓVILES --- */
        @media (max-width: 768px) {
            .main-ui {
                flex-direction: column; /* Playlist arriba o abajo */
            }
            .playlist-side {
                width: 100%;
                height: 120px; /* Se vuelve una lista horizontal pequeña */
                display: flex;
                overflow-x: auto;
                overflow-y: hidden;
                gap: 10px;
                padding: 10px;
                order: 2; /* La manda abajo de las letras */
            }
            .playlist-item {
                min-width: 150px;
                height: 100%;
                margin-bottom: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                font-size: 0.75rem;
            }
            .lyrics-zone {
                order: 1;
            }
        }

        /* Animaciones */
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div id="bg-overlay"></div>
    <div class="overlay-dark"></div>

    <div id="modal-felicitaciones">
        <div class="modal-content">
            <img src="./assets/img/icons/nosotros.png" class="modal-icon" alt="">
            <h2>Tu regalo del 14❤️</h2>
            <p style="color: #666; margin-bottom: 25px;">Espero que este detalle te alegre tanto como vos a mí. ❤️</p>
            <button class="btn-play" style="width: auto; padding: 0 30px; border-radius: 50px; height: 50px;" onclick="iniciarReproductor()">Entrar ❤️</button>
        </div>
    </div>

    <div class="main-ui">
        <div class="lyrics-zone">
            <div id="lyrics-display">...</div>
        </div>

        <div class="playlist-side" id="playlist-container">
            <h3 id="playlist-title" style="margin-bottom: 15px; font-family: 'Playfair Display'; font-size: 1rem;">Nuestras Canciones ❤️</h3>
            </div>
    </div>

    <div class="bottom-controls">
        <h2 id="song-title">---</h2>
        <p id="song-artist">---</p>
        <div class="btn-group">
            <button class="btn-nav" onclick="prevSong()">⏮</button>
            <button class="btn-play" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="btn-nav" onclick="nextSong()">⏭</button>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        // ... (Tu lista de canciones se mantiene igual)
        const songs = [
            { number: 1, title: "Someone To Spend Time With", artist: "Los Retros", background: "./Songs/s1/s1.gif", audio: "./Songs/s1/Los Retros - Someone To Spend Time With.mp3", lyrics: "./Songs/s1/song1.lrc" },
            { number: 2, title: "Lover Is a Day", artist: "CUCO", background: "./Songs/s2/s2.gif", audio: "./Songs/s2/CUCO - Lover Is a Day (Audio).mp3", lyrics: "./Songs/s2/song2.lrc" },
            { number: 3, title: "Piel Canela", artist: "Cuco", background: "./Songs/s3/s3.gif", audio: "./Songs/s3/Cuco - Piel Canela (Audio).mp3", lyrics: "./Songs/s3/song3.lrc" },
            { number: 4, title: "Decir Adios", artist: "Cuco (ft. DannyLux)", background: "./Songs/s4/s4.gif", audio: "./Songs/s4/Cuco - Decir Adios (with DannyLux) [Official Visualizer].mp3", lyrics: "./Songs/s4/song4.lrc" },
            { number: 5, title: "Bossa No Sé", artist: "Cuco (ft. Jean Carter)", background: "./Songs/s5/s5.gif", audio: "./Songs/s5/Cuco - Bossa No Sé (Lyric Video) ft. Jean Carter.mp3", lyrics: "./Songs/s5/song5.lrc" },
            { number: 6, title: "Doma", artist: "Josean Log", background: "./Songs/s6/s6.gif", audio: "./Songs/s6/Josean Log - Doma (Lyric Video).mp3", lyrics: "./Songs/s6/song6.lrc" },
            { number: 7, title: "this is what falling in love feels like", artist: "JVKE", background: "./Songs/s7/s7.gif", audio: "./Songs/s7/JVKE - this is what falling in love feels like (Lyrics).mp3", lyrics: "./Songs/s7/song7.lrc" },
            { number: 8, title: "Chachachá", artist: "Josean Log", background: "./Songs/s8/s8.gif", audio: "./Songs/s8/Josean Log - Chachachá (Lyric Video).mp3", lyrics: "./Songs/s8/song8.lrc" },
            { number: 9, title: "Alguien Como Tú", artist: "Jósean Log", background: "./Songs/s9/s9.gif", audio: "./Songs/s9/Jósean Log - Alguien Como Tú.mp3", lyrics: "./Songs/s9/song9.lrc" },
            { number: 10, title: "This Side of Paradise", artist: "Coyote Theory", background: "./Songs/s10/s10.gif", audio: "./Songs/s10/Coyote Theory - This Side of Paradise (Lyric Video).mp3", lyrics: "./Songs/s10/song10.lrc" },
            { number: 11, title: "Here With Me", artist: "d4vd", background: "./Songs/s11/s11.gif", audio: "./Songs/s11/d4vd - Here With Me [Official Music Video].mp3", lyrics: "./Songs/s11/song11.lrc" }
        ];

        let currentIndex = 0;
        let lrcLines = [];
        const audio = document.getElementById('audio-player');
        const lyricsDisplay = document.getElementById('lyrics-display');
        const playBtn = document.getElementById('play-btn');

        function cargarPlaylist() {
            const container = document.getElementById('playlist-container');
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.innerHTML = `<strong>${index + 1}.</strong> ${song.title}`;
                item.onclick = () => loadSong(index);
                container.appendChild(item);
            });
        }

        async function loadSong(index) {
            currentIndex = index;
            const song = songs[currentIndex];
            
            document.getElementById('song-title').innerText = song.title;
            document.getElementById('song-artist').innerText = song.artist;
            document.getElementById('bg-overlay').style.backgroundImage = `url(${song.background})`;
            
            audio.src = song.audio;
            
            try {
                const res = await fetch(song.lyrics);
                const text = await res.text();
                parseLRC(text);
            } catch (e) {
                lrcLines = [];
                lyricsDisplay.innerText = "Disfruta la música, amor ❤️";
            }

            document.querySelectorAll('.playlist-item').forEach((it, i) => {
                it.classList.toggle('active', i === index);
                if(i === index && window.innerWidth < 768) it.scrollIntoView({behavior: "smooth", inline: "center"});
            });
            
            audio.play();
            playBtn.innerText = '⏸';
        }

        function parseLRC(lrcText) {
            lrcLines = [];
            const lines = lrcText.split('\n');
            const timeReg = /\[(\d+):(\d+\.\d+)\]/;
            lines.forEach(line => {
                const match = timeReg.exec(line);
                if (match) {
                    const time = parseInt(match[1]) * 60 + parseFloat(match[2]);
                    const text = line.replace(timeReg, '').trim();
                    if (text) lrcLines.push({ time, text });
                }
            });
        }

        audio.ontimeupdate = () => {
            const time = audio.currentTime;
            const currentLine = lrcLines.filter(l => l.time <= time).pop();
            if (currentLine && lyricsDisplay.innerText !== currentLine.text) {
                lyricsDisplay.style.opacity = 0;
                setTimeout(() => {
                    lyricsDisplay.innerText = currentLine.text;
                    lyricsDisplay.style.opacity = 1;
                }, 200);
            }
        };

        function togglePlay() {
            if (audio.paused) { audio.play(); playBtn.innerText = '⏸'; }
            else { audio.pause(); playBtn.innerText = '▶'; }
        }

        function nextSong() { currentIndex = (currentIndex + 1) % songs.length; loadSong(currentIndex); }
        function prevSong() { currentIndex = (currentIndex - 1 + songs.length) % songs.length; loadSong(currentIndex); }
        function iniciarReproductor() {
            document.getElementById('modal-felicitaciones').style.display = 'none';
            loadSong(0);
        }

        window.onload = cargarPlaylist;
        audio.onended = nextSong;
    </script>
</body>
</html>
